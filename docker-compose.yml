services:
  # Entorno de desarrollo para programar en Python / Streamlit
  app:
    image: python:3.10-slim
    container_name: smartcity_app
    working_dir: /workspace
    volumes:
      - .:/workspace
    ports:
      - "8501:8501" # Para el Dashboard de Streamlit
    command: sleep infinity

  # 1. Base Relacional (Metadatos y Maestros)
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: smartcity_db
    ports:
      - "5432:5432"

  # 2. Base NoSQL (Telemetría IoT)
  mongodb:
    image: mongo:6.0
    container_name: mongo_db
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"

  # 3. Almacenamiento Distribuido (Hadoop HDFS)
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop_namenode
    restart: always
    environment:
      - CLUSTER_NAME=smartcity_cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_webhdfs_enabled=true
      - HDFS_CONF_dfs_permissions_enabled=false
    ports:
      - "9870:9870"
      - "9000:9000"

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop_datanode
    restart: always
    environment:
      - CLUSTER_NAME=smartcity_cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    ports:
      - "9864:9864"

  # 4. Procesamiento Distribuido (Apache Spark)
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark_master
    restart: always
    environment:
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - .:/workspace
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master

  # --- INTERFACES GRÁFICAS WEB ---

  # Interfaz gráfica para PostgreSQL (pgAdmin)
  pgadmin:
    image: dpage/pgadmin4
    container_name: smartcity_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smartcity.com
      PGADMIN_DEFAULT_PASSWORD: password123
    ports:
      - "5050:80"

  # Interfaz gráfica para MongoDB (Mongo Express)
  mongo-express:
    image: mongo-express
    container_name: smartcity_mongo_express
    restart: always
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_SERVER: mongodb
    ports:
      - "8081:8081"